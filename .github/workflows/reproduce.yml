name: reproduce

# 공개한 코드로 글꼴 네 벌(본문 판 포함)을 다시 만들어 fonts/ 의 배포 파일과 바이트 단위로 같은지 확인한다.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rebuild:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r source/requirements-build.txt
      - name: build
        run: |
          python source/build_font.py
          python source/build_font.py --clean
          python source/build_font.py --bold
          python source/build_text.py
      - name: compare with released fonts
        run: |
          cd source/build
          shasum -a 256 -c ../../SHA256SUMS
          for f in *.ttf; do cmp "$f" "../../fonts/$f"; done
          echo "rebuilt fonts are byte-identical to fonts/"
